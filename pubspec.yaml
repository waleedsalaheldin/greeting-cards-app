name: greeting_cards
description: "تطبيق بطاقات تهنئة عربية للمناسبات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  share_plus: ^11.0.0
  path_provider: ^2.1.0
  google_mobile_ads: ">=5.3.0 <9.0.0"

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: ">=0.14.0 <1.0.0"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#115E59"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 23
