name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --org com.waleedsalaheldin --project-name greeting_cards --platforms android .

      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Upload key found: release will be signed for Google Play."
          else
            echo "::warning::No KEYSTORE_BASE64 secret: building with debug key (OK for testing, NOT for Google Play)."
          fi

      - name: Patch Android project
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: greeting-cards-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
